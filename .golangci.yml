version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - depguard
    - revive
    - gocyclo
  settings:
    gocyclo:
      min-complexity: 15
    depguard:
      rules:
        core-is-pure:
          files: ["**/internal/core/**"]
          allow: ["$gostd", "github.com/agenterr/agenterr/internal/core"]
        fx-only-in-app:
          files: ["!**/internal/app/**", "!**/cmd/agenterr/**"]
          deny:
            - pkg: "go.uber.org/fx"
              desc: "fx is contained to internal/app"
