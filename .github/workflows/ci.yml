name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            echo "Run 'gofmt -w .' locally and commit the result."
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          # goinstall builds the linter with this workflow's Go toolchain;
          # the prebuilt v2.1.6 binary is compiled with go1.24 and refuses
          # repos targeting go 1.25.
          install-mode: goinstall
      - run: go test -race ./...
      - run: go test -tags e2e ./test/e2e -v
      - name: coverage gate (internal/core, internal/pipeline >= 90%)
        run: |
          go test -coverprofile=cover.out -covermode=atomic ./internal/core ./internal/pipeline
          go tool cover -func=cover.out
          total=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 90) }' || { echo "coverage ${total}% is below the 90% gate"; exit 1; }
